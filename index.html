<!DOCTYPE html>
<html lang="ms" x-data="adminData()" x-init="init()" :class="isDarkMode ? 'dark' : ''">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEEA System - Administrator Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#1d4ed8',
                        darkBg: '#030712',
                        cardDark: '#0f172a',
                        cyberBlue: '#3b82f6'
                    }
                }
            }
        }
    </script>
    <style>
        .ai-digital-bg {
            background: radial-gradient(circle at 50% 0%, #1e3a8a 0%, #0f172a 50%, #030712 100%);
            position: relative;
            overflow: hidden;
        }
        .glow-effect {
            box-shadow: 0 0 25px -5px rgba(59, 130, 246, 0.3);
        }
        .cyber-border {
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        @keyframes pulse-red {
            0% { transform: scale(0.95); opacity: 0.9; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); opacity: 0.9; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .blinking-red-dot {
            animation: pulse-red 1.5s infinite;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen flex flex-col text-sm">

    <header class="bg-gray-900/80 backdrop-blur-md border-b border-blue-500/20 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-shield-halved text-white text-base"></i>
                </div>
                <span class="font-black text-base md:text-lg tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-300">LEEA SYSTEM</span>
            </div>

            <div class="flex items-center space-x-3">
                <button @click="toggleTheme()" class="px-3.5 py-1.5 rounded-xl bg-gray-800 text-yellow-400 font-bold transition flex items-center space-x-1.5 text-xs shadow-sm">
                    <i :class="isDarkMode ? 'fa-solid fa-sun' : 'fa-solid fa-moon'"></i>
                    <span x-text="isDarkMode ? 'Light Mode' : 'Dark Mode'"></span>
                </button>

                <template x-if="isUnlocked && isLoggedIn">
                    <div class="flex items-center space-x-3 border-l pl-3 border-gray-800">
                        <div class="text-right">
                            <span class="block font-bold text-blue-300 text-xs" x-text="'Admin (' + currentAdminRole + ')'"></span>
                            <span class="text-[11px] text-emerald-400 uppercase font-bold">Node Secured</span>
                        </div>
                        <button @click="logout()" class="text-red-400 hover:text-red-300 p-2 transition text-base" title="Log Keluar">
                            <i class="fa-solid fa-power-off"></i>
                        </button>
                    </div>
                </template>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col justify-center space-y-6">

        <!-- FASA 1: Skrin Masukkan 4-Digit Unlock Code -->
        <template x-if="!isUnlocked">
            <div class="max-w-md mx-auto space-y-6 w-full">
                <div class="ai-digital-bg rounded-3xl p-6 md:p-8 text-white shadow-2xl glow-effect cyber-border backdrop-blur-md text-center">
                    <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-blue-600/20 border border-blue-500/40 flex items-center justify-center text-blue-400">
                        <i class="fa-solid fa-key text-2xl"></i>
                    </div>
                    <h2 class="text-xl font-black tracking-wider uppercase text-transparent bg-clip-text bg-gradient-to-r from-blue-300 via-white to-indigo-400 mb-1">
                        Security Clearance
                    </h2>
                    <p class="text-xs text-gray-400 mb-6">Masukkan 4-Digit Unlock Code untuk meneruskan</p>

                    <form @submit.prevent="verifyPinCode()" class="space-y-4">
                        <div>
                            <input type="password" maxlength="4" x-model="enteredPin" placeholder="••••" required class="w-48 mx-auto text-center px-4 py-3 bg-gray-950 border border-gray-800 rounded-2xl text-2xl tracking-widest text-blue-300 font-bold focus:border-blue-500 focus:outline-none shadow-inner">
                        </div>
                        <div class="text-red-400 text-xs font-bold" x-text="pinError"></div>
                        <button type="submit" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-sm rounded-xl shadow-lg glow-effect">SAHKAN KOD</button>
                    </form>
                </div>
            </div>
        </template>

        <!-- FASA 2: Log Masuk Admin (Selepas Unlock Code Sah) -->
        <template x-if="isUnlocked && !isLoggedIn">
            <div class="max-w-md mx-auto space-y-6 w-full">
                <div class="ai-digital-bg rounded-3xl p-6 md:p-8 text-white shadow-2xl glow-effect cyber-border backdrop-blur-md">
                    <div class="text-center space-y-1 mb-6">
                        <h2 class="text-2xl font-black tracking-wider uppercase text-transparent bg-clip-text bg-gradient-to-r from-blue-300 via-white to-indigo-400">
                            Master Admin Access
                        </h2>
                        <p class="text-xs text-gray-400">Pengurusan Eksklusif Sistem Architech Labs</p>
                    </div>

                    <form @submit.prevent="login()" class="space-y-4 text-xs">
                        <div>
                            <label class="block uppercase font-bold text-blue-400 mb-1 text-xs">Admin Username</label>
                            <input type="text" x-model="loginForm.username" required class="w-full px-4 py-2.5 bg-gray-950 border border-gray-800 rounded-xl text-sm text-blue-100 focus:border-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block uppercase font-bold text-blue-400 mb-1 text-xs">Password</label>
                            <input type="password" x-model="loginForm.password" required class="w-full px-4 py-2.5 bg-gray-950 border border-gray-800 rounded-xl text-sm text-blue-100 focus:border-blue-500 focus:outline-none">
                        </div>
                        <div class="text-red-400 font-bold text-xs" x-text="loginError"></div>
                        <button type="submit" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-sm rounded-xl shadow-lg glow-effect">LOGIN ADMIN PANEL</button>
                    </form>
                </div>
            </div>
        </template>

        <!-- FASA 3: Papan Pemuka Admin (Master Dashboard) -->
        <template x-if="isUnlocked && isLoggedIn">
            <div class="space-y-6 text-xs">
                <!-- KOTAK ATAS: Tona Gelap Korporat Jelas & Bersih -->
                <div class="bg-gradient-to-r from-blue-950 via-indigo-950 to-gray-900 rounded-2xl p-6 text-white cyber-border glow-effect shadow-xl flex justify-between items-center">
                    <div>
                        <h1 class="text-2xl font-black text-white">Administrator Panel</h1>
                        <p class="text-blue-200 text-xs mt-1 font-semibold">Urus akaun klien, tetapan pelayan, dan pengurusan pembayaran komisen affiliate.</p>
                        <p class="text-xs text-blue-400 mt-2 font-bold">
                            <i class="fa-solid fa-clock-rotate-left mr-1"></i> Kemaskini Terkini: <span x-text="lastUpdatedTime"></span>
                        </p>
                    </div>
                    <div class="bg-gray-950 border border-blue-500/40 px-5 py-3 rounded-xl text-right shadow-inner">
                        <span class="block text-xs text-gray-400 font-bold uppercase">Jumlah Klien Aktif</span>
                        <span class="font-black text-2xl text-blue-300" x-text="clients.length"></span>
                    </div>
                </div>

                <!-- KOTAK VERCEL & RAILWAY DEPLOY MONITOR -->
                <div class="bg-gray-900 p-6 rounded-2xl cyber-border shadow-md space-y-4">
                    <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                        <div class="flex items-center space-x-2">
                            <i class="fa-solid fa-cloud-arrow-up text-blue-400 text-base"></i>
                            <h3 class="font-bold text-sm text-blue-300">Vercel & Railway Deploy Status Monitor</h3>
                        </div>
                        <button @click="checkDeployStatus()" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl shadow transition">
                            <i class="fa-solid fa-rotate mr-1"></i> Semak Status Deploy
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                        <div class="p-4 bg-gray-950 rounded-xl cyber-border flex flex-col justify-between shadow-inner">
                            <div class="flex justify-between items-center">
                                <span class="text-gray-400 font-bold uppercase text-xs">Portal Klien (Vercel Server)</span>
                                <a href="https://leea-portal.vercel.app" target="_blank" class="text-blue-400 font-bold hover:underline text-xs">Buka Portal <i class="fa-solid fa-arrow-up-right-from-square ml-0.5"></i></a>
                            </div>
                            <div class="mt-3 flex items-center space-x-2">
                                <span class="w-3.5 h-3.5 rounded-full" :class="vercelStatus.isOnline ? 'bg-emerald-500 animate-pulse' : 'bg-yellow-500'"></span>
                                <span class="font-bold text-sm" :class="vercelStatus.isOnline ? 'text-emerald-400' : 'text-yellow-400'" x-text="vercelStatus.statusText"></span>
                            </div>
                            <span class="text-xs text-gray-500 mt-2 block font-medium" x-text="'Masa Semak: ' + vercelStatus.lastChecked"></span>
                        </div>

                        <div class="p-4 bg-gray-950 rounded-xl cyber-border flex flex-col justify-between shadow-inner">
                            <div class="flex justify-between items-center">
                                <span class="text-gray-400 font-bold uppercase text-xs">Backend Bot (Railway Server)</span>
                                <span class="text-indigo-300 font-bold text-xs">Multi-Tenant API</span>
                            </div>
                            <div class="mt-3 flex items-center space-x-2">
                                <span class="w-3.5 h-3.5 rounded-full" :class="railwayStatus.isOnline ? 'bg-emerald-500 animate-pulse' : 'bg-red-500'"></span>
                                <span class="font-bold text-sm" :class="railwayStatus.isOnline ? 'text-emerald-400' : 'text-red-400'" x-text="railwayStatus.statusText"></span>
                            </div>
                            <span class="text-xs text-gray-500 mt-2 block font-medium" x-text="'Masa Semak: ' + railwayStatus.lastChecked"></span>
                        </div>
                    </div>
                </div>

                <!-- REALTIME CHAT (LEEA BOT) - MASA MENGIKUT WAKTU PIAWAI MALAYSIA PERSIS WHATSAPP -->
                <div class="bg-gray-900 p-6 rounded-2xl cyber-border shadow-md space-y-4">
                    <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                        <div class="flex items-center space-x-2">
                            <div class="w-3.5 h-3.5 bg-emerald-500 rounded-full animate-pulse"></div>
                            <h3 class="font-bold text-sm text-blue-300 uppercase tracking-wide">Realtime LEEA Bot (Webhook)</h3>
                        </div>
                        <button @click="toggleHumanTouch()" class="px-4 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-2 shadow-sm" :class="humanTouchActive ? 'bg-amber-600 text-white shadow' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'">
                            <i class="fa-solid fa-headset text-sm"></i>
                            <span x-text="humanTouchActive ? 'Human: ON' : 'Human: OFF'"></span>
                        </button>
                    </div>

                    <!-- Live Chat Area Lengkap & Luas -->
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-4 h-[360px]">
                        <div class="md:col-span-4 border-r border-gray-800 overflow-y-auto divide-y divide-gray-800 text-xs bg-gray-950/40 rounded-xl p-2 shadow-inner">
                            <template x-for="chat in liveChats" :key="chat.id">
                                <div @click="activeChat = chat" class="p-3.5 cursor-pointer hover:bg-gray-800/40 transition rounded-xl font-medium" :class="activeChat && activeChat.id === chat.id ? 'bg-blue-950/80 border-l-4 border-blue-500 font-bold' : ''">
                                    <div class="flex justify-between items-center">
                                        <span class="font-bold text-blue-200 text-sm" x-text="chat.phone"></span>
                                        <span class="text-[10px] text-gray-400 font-mono" x-text="chat.lastTime"></span>
                                    </div>
                                    <div class="text-gray-400 truncate mt-1 text-xs" x-text="chat.lastMessage"></div>
                                </div>
                            </template>
                            <template x-if="liveChats.length === 0">
                                <div class="p-8 text-center text-gray-500 text-xs font-medium">Menunggu rekod perbualan LEEA Bot di Google Sheets...</div>
                            </template>
                        </div>

                        <div class="md:col-span-8 flex flex-col bg-gray-950/40 rounded-xl p-4 justify-between shadow-inner">
                            <template x-if="!activeChat">
                                <div class="flex items-center justify-center flex-grow text-gray-400 text-sm font-medium text-center p-6">
                                    Sila pilih senarai perbualan LEEA Bot di sebelah kiri untuk pantau / balas.
                                </div>
                            </template>
                            <template x-if="activeChat">
                                <div class="flex flex-col h-full justify-between space-y-3">
                                    <div class="p-3.5 bg-gray-900 border border-gray-800 rounded-xl font-bold text-blue-300 text-sm shadow-sm flex justify-between items-center">
                                        <span x-text="'Chat bersama: ' + activeChat.phone"></span>
                                        <span class="text-[11px] text-emerald-400 font-bold uppercase">Waktu Malaysia (GMT+8)</span>
                                    </div>
                                    <div class="overflow-y-auto space-y-2.5 text-xs max-h-[210px] p-2 flex-grow">
                                        <template x-for="msg in activeChat.messages">
                                            <div class="flex" :class="msg.sender === 'customer' ? 'justify-start' : 'justify-end'">
                                                <div class="max-w-[85%] rounded-2xl px-4 py-2.5 text-xs font-medium shadow-sm" :class="msg.sender === 'customer' ? 'bg-gray-800 text-gray-200' : 'bg-blue-600 text-white font-semibold'">
                                                    <p x-text="msg.text"></p>
                                                    <span class="text-[10px] opacity-70 block text-right mt-1 font-mono" x-text="msg.time"></span>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                    
                                    <form @submit.prevent="sendAdminReply()" class="flex space-x-2 pt-2 items-center">
                                        <input type="text" x-model="adminReplyText" :placeholder="humanTouchActive ? 'Taip mesej manual LEEA...' : 'Aktifkan Human Touch di atas...'" :disabled="!humanTouchActive" class="flex-grow px-4 py-3 bg-gray-950 border border-gray-800 rounded-xl text-xs text-blue-100 focus:outline-none shadow-sm font-medium disabled:opacity-50">
                                        <button type="submit" :disabled="!humanTouchActive" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl transition shadow whitespace-nowrap disabled:opacity-50">Hantar</button>
                                    </form>
                                </div>
                            </template>
                        </div>
                    </div>

                    <div class="text-xs text-gray-400 text-right font-semibold pt-1">
                        URL: https://leeasystem-production.up.railway.app
                    </div>
                </div>

                <!-- HANTAR MESEJ INBOX & KOD UNLOCK KHAS -->
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <div class="lg:col-span-6 bg-gray-900 p-6 rounded-2xl cyber-border shadow-md space-y-4 flex flex-col justify-between">
                        <div class="border-b border-gray-800 pb-3 flex items-center space-x-2">
                            <i class="fa-solid fa-paper-plane text-blue-400 text-base"></i>
                            <h3 class="font-bold text-sm text-blue-300 uppercase">Hantar Mesej Klien (Inbox)</h3>
                        </div>

                        <form @submit.prevent="sendAdminBroadcastMessage()" class="space-y-4 flex-grow flex flex-col justify-between">
                            <div class="space-y-3.5">
                                <div>
                                    <label class="block uppercase font-bold text-blue-400 mb-1 text-xs">Pilih Penerima Klien</label>
                                    <select x-model="broadcastForm.target" class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-xl text-blue-100 focus:outline-none focus:border-blue-500 shadow-sm font-medium text-xs">
                                        <option value="ALL">📢 Semua Klien (All Clients)</option>
                                        <template x-for="client in clients" :key="client.clientId">
                                            <option :value="client.username" x-text="client.clientId + ' - ' + (client.companyName || client.username)"></option>
                                        </template>
                                    </select>
                                </div>
                                <div>
                                    <label class="block uppercase font-bold text-blue-400 mb-1 text-xs">Tajuk / Pengirim</label>
                                    <input type="text" x-model="broadcastForm.senderTitle" placeholder="Master Administrator" required class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-xl text-blue-100 focus:outline-none focus:border-blue-500 shadow-sm font-medium text-xs">
                                </div>
                                <div>
                                    <label class="block uppercase font-bold text-blue-400 mb-1 text-xs">Kandungan Mesej</label>
                                    <textarea x-model="broadcastForm.content" rows="3" placeholder="Taip mesej pengumuman..." required class="w-full p-3.5 bg-gray-950 border border-gray-800 rounded-xl text-blue-100 focus:outline-none focus:border-blue-500 leading-relaxed shadow-sm font-medium text-xs"></textarea>
                                </div>
                            </div>

                            <div class="pt-3">
                                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl shadow glow-effect transition">Hantar Mesej Klien</button>
                            </div>
                        </form>
                    </div>

                    <div class="lg:col-span-6 bg-gray-900 p-6 rounded-2xl cyber-border shadow-md space-y-4 flex flex-col justify-between">
                        <div class="space-y-4">
                            <h3 class="font-bold text-sm text-blue-300">Pengurusan Kod Unlock Khas (Pegawai / Admin Baru)</h3>
                            <div class="grid grid-cols-1 gap-3 max-h-[170px] overflow-y-auto pr-1">
                                <template x-for="(adminItem, idx) in authorizedPins" :key="idx">
                                    <div class="p-3.5 bg-gray-950 border border-gray-800 rounded-xl flex justify-between items-center text-xs shadow-sm">
                                        <div>
                                            <span class="text-gray-400 block text-[11px] font-bold uppercase">NAMA / JAWATAN:</span>
                                            <span class="text-white font-bold text-sm" x-text="adminItem.name"></span>
                                            <span class="text-blue-400 block mt-1 font-semibold text-xs">PIN: ****</span>
                                        </div>
                                        <button @click="deleteAdminPin(idx)" class="text-red-400 hover:text-red-300 p-2.5" title="Padam Kod">
                                            <i class="fa-solid fa-trash text-sm"></i>
                                        </button>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <form @submit.prevent="addNewAdminPin()" class="space-y-3 pt-2">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <div>
                                    <input type="text" x-model="newAdminName" placeholder="Nama Pegawai Baru" required class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-xl text-xs text-blue-100 focus:outline-none focus:border-blue-500 shadow-sm font-medium">
                                </div>
                                <div>
                                    <input type="password" maxlength="4" x-model="newAdminPinCode" placeholder="PIN 4 Digit" required class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-xl text-xs text-blue-100 focus:outline-none focus:border-blue-500 shadow-sm font-medium">
                                </div>
                            </div>
                            <div>
                                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl shadow transition">Tambah Kod Akses</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- PENGURUSAN AGEN AFFILIATE & PAYOUT KOMISEN -->
                <div class="bg-gray-900 rounded-2xl cyber-border overflow-hidden shadow-md">
                    <div class="p-6 border-b border-gray-800 flex justify-between items-center bg-gray-950">
                        <div>
                            <h3 class="font-bold text-sm text-blue-300"><i class="fa-solid fa-handshake-angle mr-2"></i> Senarai Agen Affiliate & Pembayaran Komisen (3%)</h3>
                            <p class="text-xs text-gray-400 mt-0.5 font-medium">Semak baki e-wallet klien, maklumat akaun bank/DuitNow, dan laksanakan pembayaran komisen.</p>
                        </div>
                        <span class="px-4 py-2 bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 rounded-full font-bold shadow-sm text-xs" x-text="'Jumlah Agen: ' + getAffiliateAgents().length"></span>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-950/80 text-gray-400 uppercase border-b border-gray-800 text-xs font-bold">
                                    <th class="p-4">Username / Klien</th>
                                    <th class="p-4">Status Agen</th>
                                    <th class="p-4">Baki E-Wallet</th>
                                    <th class="p-4">Maklumat Bank / DuitNow</th>
                                    <th class="p-4">Jumlah Rujukan</th>
                                    <th class="p-4 text-center">Tindakan Payout Komisen</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-800/60 font-medium">
                                <template x-for="client in clients" :key="client.username">
                                    <tr class="hover:bg-gray-800/30 transition">
                                        <td class="p-4 font-bold text-white">
                                            <div class="text-sm" x-text="client.companyName || client.username"></div>
                                            <span class="text-xs text-blue-400 font-semibold" x-text="'@' + client.username"></span>
                                        </td>
                                        <td class="p-4">
                                            <span class="px-3.5 py-1.5 text-xs font-bold rounded-full shadow-sm" :class="getClientAffiliateData(client.username).isAgent ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-gray-800 text-gray-400'" x-text="getClientAffiliateData(client.username).isAgent ? 'AKTIF 🟢' : 'BELUM DAFTAR'"></span>
                                        </td>
                                        <td class="p-4 font-black text-emerald-400 text-sm" x-text="'RM ' + getClientAffiliateData(client.username).walletBalance.toFixed(2)"></td>
                                        <td class="p-4 text-xs text-gray-300">
                                            <template x-if="getClientBankData(client.username).accountNo">
                                                <div class="space-y-0.5">
                                                    <strong class="text-blue-300 font-bold" x-text="getClientBankData(client.username).bankName"></strong><br>
                                                    <span class="font-bold" x-text="'No: ' + getClientBankData(client.username).accountNo"></span><br>
                                                    <span class="text-gray-400" x-text="'Nama: ' + getClientBankData(client.username).accountHolder"></span>
                                                </div>
                                            </template>
                                            <template x-if="!getClientBankData(client.username).accountNo">
                                                <span class="text-gray-500 italic">Belum tetapkan akaun</span>
                                            </template>
                                        </td>
                                        <td class="p-4 font-bold text-indigo-300 text-sm" x-text="getClientAffiliateData(client.username).totalReferrals + ' orang'"></td>
                                        <td class="p-4 text-center">

    <script>
        function adminData() {
            return {
                isUnlocked: false,
                enteredPin: '',
                pinError: '',
                isLoggedIn: false,
                currentAdminRole: 'Superadmin',
                isDarkMode: true,
                loginForm: { username: '', password: '' },
                loginError: '',
                clients: [],
                authorizedPins: [],
                newAdminName: '',
                newAdminPinCode: '',
                showClientModal: false,
                modalMode: 'add',
                editIndex: null,
                clientForm: { companyName: '', username: '', password: '', phone: '', email: '', railwayUrl: '' },
                lastUpdatedTime: '',
                liveChats: [],
                activeChat: null,
                adminReplyText: '',
                humanTouchActive: false,
                
                // ENDPOINT GOOGLE APPS SCRIPT RASMI TAB Log_Chat
                gasEndpointUrl: "https://script.google.com/macros/s/AKfycbyqrB75MYg92E8thEiMPMF1ws1irQpQger3nTZryzR_jIBDHspdSHpE3kHtweCGWHT5/exec",

                broadcastForm: {
                    target: 'ALL',
                    senderTitle: 'Master Administrator',
                    content: ''
                },
                
                vercelStatus: {
                    isOnline: false,
                    statusText: 'Menyemak...',
                    lastChecked: '-'
                },

                railwayStatus: {
                    isOnline: false,
                    statusText: 'Menyemak...',
                    lastChecked: '-'
                },

                init() {
                    this.fetchClients();
                    this.fetchAdminPins();
                    this.updateTimestamp();
                    this.checkDeployStatus();
                    this.fetchLiveChats();

                    const savedTheme = localStorage.getItem('leea_admin_theme');
                    if (savedTheme === 'light') {
                        this.isDarkMode = false;
                    } else {
                        this.isDarkMode = true;
                    }

                    if (localStorage.getItem('leea_admin_unlocked') === 'true') {
                        this.isUnlocked = true;
                        this.currentAdminRole = localStorage.getItem('leea_admin_role_name') || 'Superadmin';
                    }
                    if (localStorage.getItem('leea_admin_logged') === 'true') {
                        this.isLoggedIn = true;
                    }

                    setInterval(() => {
                        if (this.isUnlocked && this.isLoggedIn) {
                            this.fetchLiveChats();
                        }
                    }, 4000);
                },

                // PENUKARAN FORMAT WAKTU MALAYSIA SAMA SEPERTI WHATSAPP (CONTOH: 03:07 PM)
                formatMalaysiaTime(rawTime) {
                    if (!rawTime) return '';
                    try {
                        const str = String(rawTime).trim();
                        if (str.includes('AM') || str.includes('PM')) {
                            const timeMatch = str.match(/\d{1,2}:\d{2}(:\d{2})?\s*(AM|PM)/i);
                            if (timeMatch) {
                                return timeMatch[0].replace(/:\d{2}\s/, ' ');
                            }
                        }

                        const d = new Date(rawTime);
                        if (!isNaN(d.getTime())) {
                            return d.toLocaleTimeString('en-US', {
                                timeZone: 'Asia/Kuala_Lumpur',
                                hour: '2-digit',
                                minute: '2-digit',
                                hour12: true
                            });
                        }
                    } catch (e) {}

                    return String(rawTime).substring(11, 16);
                },

                getMalaysiaNowTime() {
                    return new Date().toLocaleTimeString('en-US', {
                        timeZone: 'Asia/Kuala_Lumpur',
                        hour: '2-digit',
                        minute: '2-digit',
                        hour12: true
                    });
                },

                toggleTheme() {
                    this.isDarkMode = !this.isDarkMode;
                    localStorage.setItem('leea_admin_theme', this.isDarkMode ? 'dark' : 'light');
                },

                getClientAffiliateData(username) {
                    const saved = localStorage.getItem('leea_affiliate_' + username);
                    if (saved) {
                        try {
                            const parsed = JSON.parse(saved);
                            return parsed.data || { isAgent: false, walletBalance: 0, totalReferrals: 0, totalEarned: 0 };
                        } catch(e) {}
                    }
                    return { isAgent: false, walletBalance: 0, totalReferrals: 0, totalEarned: 0 };
                },

                getClientBankData(username) {
                    const saved = localStorage.getItem('leea_affiliate_' + username);
                    if (saved) {
                        try {
                            const parsed = JSON.parse(saved);
                            return parsed.bank || { bankName: '', accountNo: '', accountHolder: '' };
                        } catch(e) {}
                    }
                    return { bankName: '', accountNo: '', accountHolder: '' };
                },

                getAffiliateAgents() {
                    return this.clients.filter(c => this.getClientAffiliateData(c.username).isAgent);
                },

                async processAffiliatePayout(client) {
                    const affData = this.getClientAffiliateData(client.username);
                    const bankData = this.getClientBankData(client.username);

                    if (affData.walletBalance <= 0) {
                        alert('Baki e-wallet klien ini adalah RM0.00.');
                        return;
                    }

                    if (!bankData.accountNo) {
                        alert('Klien ini belum menetapkan akaun bank/DuitNow.');
                        return;
                    }

                    const payoutAmount = affData.walletBalance;

                    if (confirm(`Sahkan pembayaran komisen sebanyak RM ${payoutAmount.toFixed(2)} kepada ${client.companyName || client.username} (${bankData.bankName} - ${bankData.accountNo})?`)) {
                        affData.walletBalance = 0;
                        
                        const saved = localStorage.getItem('leea_affiliate_' + client.username);
                        let fullData = saved ? JSON.parse(saved) : {};
                        fullData.data = affData;
                        localStorage.setItem('leea_affiliate_' + client.username, JSON.stringify(fullData));

                        const nowString = new Date().toLocaleString('en-GB', {
                            timeZone: 'Asia/Kuala_Lumpur',
                            year: 'numeric',
                            month: '2-digit',
                            day: '2-digit',
                            hour: '2-digit',
                            minute: '2-digit',
                            hour12: true
                        });

                        const emailPayload = {
                            timestamp: nowString,
                            type: 'payout_email',
                            sender: 'Master Administrator',
                            username: client.username,
                            role: 'admin',
                            message: `[NOTIFIKASI E-MEL PEMBAYARAN KOMISEN]\nKepada: ${client.email}\nSyarikat: ${client.companyName || client.username}\n\nSukacita dimaklumkan pembayaran komisen affiliate sebanyak RM ${payoutAmount.toFixed(2)} telah berjaya dikreditkan ke akaun ${bankData.bankName} (${bankData.accountNo}).\n\nTerima kasih,\nArchitech Labs`
                        };

                        try {
                            await fetch(this.gasEndpointUrl, {
                                method: 'POST',
                                mode: 'no-cors',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(emailPayload)
                            });
                        } catch (err) {
                            console.error("Gagal rekod e-mel payout ke DB sheet:", err);
                        }

                        alert(`Payout sebanyak RM ${payoutAmount.toFixed(2)} berjaya diproses!\n\n- Baki E-Wallet klien telah ditolak kepada RM0.00.\n- Rekod pembayaran & notifikasi e-mel telah dihantar kepada (${client.email}).`);
                    }
                },

                toggleHumanTouch() {
                    this.humanTouchActive = !this.humanTouchActive;
                    alert(this.humanTouchActive ? 'Mod Human Touch diaktifkan!' : 'Mod Human Touch ditutup.');
                },

                async sendAdminBroadcastMessage() {
                    if (!this.broadcastForm.content.trim()) return;

                    const nowMalaysiaDate = new Date().toLocaleString('en-GB', { timeZone: 'Asia/Kuala_Lumpur' });

                    const payload = {
                        timestamp: nowMalaysiaDate,
                        type: 'inbox',
                        sender: this.broadcastForm.senderTitle,
                        phone: '-',
                        role: 'admin',
                        message: this.broadcastForm.content,
                        targetClient: this.broadcastForm.target
                    };

                    try {
                        await fetch(this.gasEndpointUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        alert('Mesej berjaya dihantar ke Google Sheets Inbox klien!');
                        this.broadcastForm.content = '';
                    } catch (err) {
                        console.error("Gagal hantar mesej inbox:", err);
                        alert('Ralat semasa menghantar mesej inbox.');
                    }
                },

                async fetchLiveChats() {
                    const url = this.gasEndpointUrl + "?t=" + new Date().getTime();
                    try {
                        const res = await fetch(url);
                        const data = await res.json();
                        if (data && data.status === "success" && Array.isArray(data.data)) {
                            const chatMap = {};
                            let lastPhone = "601123687357";

                            data.data.forEach(row => {
                                if (row.type && row.type !== 'chat') return;

                                let phone = row.phone ? String(row.phone).trim() : lastPhone;
                                if (!phone || phone === "Unknown" || phone === "-") phone = lastPhone;
                                else lastPhone = phone;

                                const cleanPhone = phone.replace(/[^0-9]/g, '');
                                if (!chatMap[cleanPhone]) {
                                    chatMap[cleanPhone] = { id: 'chat-' + cleanPhone, phone: cleanPhone, lastMessage: '', lastTime: '', messages: [] };
                                }

                                const formattedTime = this.formatMalaysiaTime(row.timestamp);

                                if (row.message) {
                                    chatMap[cleanPhone].messages.push({
                                        sender: row.role || 'customer',
                                        text: row.message,
                                        time: formattedTime
                                    });
                                    chatMap[cleanPhone].lastMessage = row.message;
                                    chatMap[cleanPhone].lastTime = formattedTime;
                                }
                            });

                            this.liveChats = Object.values(chatMap);
                            if (this.liveChats.length > 0 && !this.activeChat) {
                                this.activeChat = this.liveChats[0];
                            } else if (this.activeChat) {
                                const found = this.liveChats.find(c => c.id === this.activeChat.id);
                                if (found) this.activeChat = found;
                            }
                        }
                    } catch (err) {
                        console.error("Gagal tarik data chat LEEA Bot:", err);
                    }
                },

                async sendAdminReply() {
                    if (!this.adminReplyText.trim() || !this.activeChat) return;
                    if (!this.humanTouchActive) {
                        alert('Sila aktifkan "Human Touch" terlebih dahulu!');
                        return;
                    }

                    const nowMalaysiaDate = new Date().toLocaleString('en-GB', {
                        timeZone: 'Asia/Kuala_Lumpur',
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: true
                    });

                    const displayTime = this.getMalaysiaNowTime();

                    const payload = {
                        timestamp: nowMalaysiaDate,
                        type: 'chat',
                        sender: 'LEEA Admin',
                        phone: this.activeChat.phone,
                        role: 'agent',
                        message: this.adminReplyText,
                        targetClient: 'ALL'
                    };

                    try {
                        await fetch(this.gasEndpointUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        this.activeChat.messages.push({ sender: 'agent', text: this.adminReplyText, time: displayTime });
                        this.activeChat.lastMessage = this.adminReplyText;
                        this.activeChat.lastTime = displayTime;
                        this.adminReplyText = '';
                    } catch(err) {
                        console.error("Gagal hantar balasan chat:", err);
                    }
                },

                async checkDeployStatus() {
                    try {
                        await fetch('https://leea-portal.vercel.app', { method: 'GET', mode: 'no-cors' });
                        this.vercelStatus.isOnline = true;
                        this.vercelStatus.statusText = 'DEPLOYED & READY 🟢';
                    } catch (err) {
                        this.vercelStatus.isOnline = false;
                        this.vercelStatus.statusText = 'SEDANG DEPLOY / OFFLINE 🟡';
                    }

                    try {
                        await fetch('https://leeasystem-production.up.railway.app', { method: 'GET', mode: 'no-cors' });
                        this.railwayStatus.isOnline = true;
                        this.railwayStatus.statusText = 'ONLINE & ACTIVE 🟢';
                    } catch (err) {
                        this.railwayStatus.isOnline = false;
                        this.railwayStatus.statusText = 'OFFLINE / REDEPLOYING... 🟡';
                    }

                    this.vercelStatus.lastChecked = this.getMalaysiaNowTime();
                    this.railwayStatus.lastChecked = this.getMalaysiaNowTime();
                },

                fetchAdminPins() {
                    const saved = localStorage.getItem('leea_authorized_pins');
                    if (saved) {
                        this.authorizedPins = JSON.parse(saved);
                    } else {
                        this.authorizedPins = [
                            { name: 'Superadmin Utama', pin: '7357' }
                        ];
                        localStorage.setItem('leea_authorized_pins', JSON.stringify(this.authorizedPins));
                    }
                },

                verifyPinCode() {
                    this.pinError = '';
                    const matched = this.authorizedPins.find(item => item.pin === this.enteredPin.trim());
                    if (matched) {
                        this.isUnlocked = true;
                        this.currentAdminRole = matched.name;
                        localStorage.setItem('leea_admin_unlocked', 'true');
                        localStorage.setItem('leea_admin_role_name', matched.name);
                        this.enteredPin = '';
                    } else {
                        this.pinError = 'Unlock Code Salah! Sila cuba lagi.';
                    }
                },

                addNewAdminPin() {
                    if (this.newAdminPinCode.length !== 4) {
                        alert('Kod PIN mesti tepat 4 digit!');
                        return;
                    }
                    this.authorizedPins.push({
                        name: this.newAdminName,
                        pin: this.newAdminPinCode.trim()
                    });
                    localStorage.setItem('leea_authorized_pins', JSON.stringify(this.authorizedPins));
                    this.newAdminName = '';
                    this.newAdminPinCode = '';
                    alert('Kod PIN admin baharu berjaya didaftarkan!');
                },

                deleteAdminPin(index) {
                    if (this.authorizedPins.length <= 1) {
                        alert('Anda mesti kekalkan sekurang-kurangnya satu kod akses!');
                        return;
                    }
                    if (confirm('Padam akses kod ini?')) {
                        this.authorizedPins.splice(index, 1);
                        localStorage.setItem('leea_authorized_pins', JSON.stringify(this.authorizedPins));
                    }
                },

                updateTimestamp() {
                    const now = new Date();
                    this.lastUpdatedTime = now.toLocaleString('en-GB', {
                        timeZone: 'Asia/Kuala_Lumpur',
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: true
                    });
                },

                fetchClients() {
                    const saved = localStorage.getItem('leea_admin_clients');
                    if (saved) {
                        try {
                            const parsed = JSON.parse(saved);
                            this.clients = parsed.filter(c => {
                                const u = (c.username || '').toLowerCase();
                                const comp = (c.companyName || '').toLowerCase();
                                return !u.includes('architech') && !comp.includes('architech');
                            });
                        } catch(e) {
                            this.clients = [];
                        }
                    } else {
                        this.clients = [
                            { clientId: 'CLI-1001', companyName: 'Shahril Basri Leisure Enterprise', username: 'sbltransport', password: 'securepass456', phone: '+60132434200', email: 'architechlabs.io@gmail.com', railwayUrl: 'https://web-production-07b92.up.railway.app', status: 'Paid 🟢', expiryDate: '27/09/2026', planTier: 'v1 pro' }
                        ];
                        localStorage.setItem('leea_admin_clients', JSON.stringify(this.clients));
                    }
                },

                saveClients() {
                    const cleaned = this.clients.filter(c => {
                        const u = (c.username || '').toLowerCase();
                        const comp = (c.companyName || '').toLowerCase();
                        return !u.includes('architech') && !comp.includes('architech');
                    });
                    localStorage.setItem('leea_admin_clients', JSON.stringify(cleaned));
                    this.updateTimestamp();
                },

                login() {
                    this.loginError = '';
                    if (this.loginForm.username === 'admin' && this.loginForm.password === 'adminpassword123') {
                        this.isLoggedIn = true;
                        localStorage.setItem('leea_admin_logged', 'true');
                        this.updateTimestamp();
                        this.checkDeployStatus();
                    } else {
                        this.loginError = 'ID Admin atau Katalaluan Salah!';
                    }
                },

                logout() {
                    this.isLoggedIn = false;
                    this.isUnlocked = false;
                    localStorage.removeItem('leea_admin_logged');
                    localStorage.removeItem('leea_admin_unlocked');
                    localStorage.removeItem('leea_admin_role_name');
                },

                openClientModal(mode, index = null) {
                    this.modalMode = mode;
                    if (mode === 'edit' && index !== null) {
                        this.editIndex = index;
                        const c = this.clients[index];
                        this.clientForm = { 
                            companyName: c.companyName || c.username, 
                            username: c.username, 
                            password: c.password, 
                            phone: c.phone, 
                            email: c.email, 
                            railwayUrl: c.railwayUrl 
                        };
                    } else {
                        this.editIndex = null;
                        this.clientForm = { companyName: '', username: '', password: '', phone: '', email: '', railwayUrl: '' };
                    }
                    this.showClientModal = true;
                },

                async saveClient() {
                    const checkText = (this.clientForm.companyName + this.clientForm.username).toLowerCase();
                    if (checkText.includes('architech')) {
                        alert('Keselamatan Sistem: Penggunaan nama atau keyword "architech" adalah dilarang sama sekali.');
                        return;
                    }

                    let assignedId = '';
                    if (this.modalMode === 'edit' && this.editIndex !== null) {
                        this.clients[this.editIndex].companyName = this.clientForm.companyName;
                        this.clients[this.editIndex].username = this.clientForm.username;
                        this.clients[this.editIndex].password = this.clientForm.password;
                        this.clients[this.editIndex].phone = this.clientForm.phone;
                        this.clients[this.editIndex].email = this.clientForm.email;
                        this.clients[this.editIndex].railwayUrl = this.clientForm.railwayUrl;
                        alert('Maklumat klien berjaya dikemaskini!');
                    } else {
                        const nextId = 1001 + this.clients.length;
                        assignedId = `CLI-${nextId}`;
                        this.clients.push({
                            clientId: assignedId,
                            companyName: this.clientForm.companyName,
                            username: this.clientForm.username,
                            password: this.clientForm.password,
                            phone: this.clientForm.phone,
                            email: this.clientForm.email,
                            railwayUrl: this.clientForm.railwayUrl,
                            status: 'Paid 🟢',
                            expiryDate: '27/09/2026',
                            planTier: 'v1 pro'
                        });

                        alert('Klien baru berjaya didaftarkan!');
                    }
                    this.saveClients();
                    this.showClientModal = false;
                },

                approveRenewal(index) {
                    this.clients[index].status = 'Paid 🟢';
                    this.saveClients();
                    alert('Status langganan klien diperbaharui!');
                },

                deleteClient(index) {
                    if (confirm('Adakah anda pasti mahu memadam akaun klien ini?')) {
                        this.clients.splice(index, 1);
                        this.saveClients();
                    }
                }
            }
        }
    </script>
</body>
</html>
