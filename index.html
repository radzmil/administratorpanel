<!DOCTYPE html>
<html lang="ms" x-data="adminData()" x-init="init()" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEEA System - Master Administrator Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#1d4ed8',
                        darkBg: '#030712',
                        cardDark: '#0f172a',
                        cyberBlue: '#60a5fa'
                    }
                }
            }
        }
    </script>
    <style>
        .ai-digital-bg {
            background: radial-gradient(circle at 50% 0%, #1e3a8a 0%, #0f172a 50%, #030712 100%);
            position: relative;
            overflow: hidden;
        }
        .ai-digital-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }
        .glow-effect {
            box-shadow: 0 0 25px -5px rgba(59, 130, 246, 0.3);
        }
        .cyber-border {
            border: 1px solid rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-gray-900/80 backdrop-blur-md border-b border-blue-500/20 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center glow-effect">
                    <i class="fa-solid fa-shield-halved text-white text-sm"></i>
                </div>
                <span class="font-black text-lg tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-300">LEEA ADMIN MASTER</span>
            </div>

            <template x-if="isUnlocked && isLoggedIn">
                <div class="flex items-center space-x-4">
                    <div class="text-right">
                        <span class="block text-sm font-bold text-blue-300" x-text="'Admin (' + currentAdminRole + ')'"></span>
                        <span class="text-[10px] font-mono text-emerald-400 uppercase">Architech Node Secured</span>
                    </div>
                    <button @click="logout()" class="text-red-400 hover:text-red-300 p-2 transition" title="Log Keluar">
                        <i class="fa-solid fa-power-off"></i>
                    </button>
                </div>
            </template>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col justify-center">

        <!-- FASA 1: Skrin Masukkan 4-Digit Unlock Code -->
        <template x-if="!isUnlocked">
            <div class="max-w-md mx-auto space-y-6 w-full">
                <div class="ai-digital-bg rounded-3xl p-6 md:p-8 text-white shadow-2xl glow-effect cyber-border backdrop-blur-md text-center">
                    <div class="w-12 h-12 mx-auto mb-4 rounded-2xl bg-blue-600/20 border border-blue-500/40 flex items-center justify-center text-blue-400">
                        <i class="fa-solid fa-key text-xl"></i>
                    </div>
                    <h2 class="text-xl font-black tracking-wider uppercase text-transparent bg-clip-text bg-gradient-to-r from-blue-300 via-white to-indigo-400 mb-1">
                        Security Clearance
                    </h2>
                    <p class="text-xs text-gray-400 font-mono mb-6">Masukkan 4-Digit Unlock Code untuk meneruskan</p>

                    <form @submit.prevent="verifyPinCode()" class="space-y-4">
                        <div>
                            <input type="password" maxlength="4" x-model="enteredPin" placeholder="••••" required class="w-48 mx-auto text-center px-4 py-3 bg-gray-950 border border-gray-800 rounded-2xl text-2xl tracking-widest text-blue-300 font-mono focus:border-blue-500 focus:outline-none shadow-inner">
                        </div>
                        <div class="text-red-400 text-xs font-mono" x-text="pinError"></div>
                        <button type="submit" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold font-mono text-xs rounded-xl shadow-lg glow-effect">SAHKAN KOD</button>
                    </form>
                </div>
            </div>
        </template>

        <!-- FASA 2: Log Masuk Admin (Selepas Unlock Code Sah) -->
        <template x-if="isUnlocked && !isLoggedIn">
            <div class="max-w-md mx-auto space-y-6 w-full">
                <div class="ai-digital-bg rounded-3xl p-6 md:p-8 text-white shadow-2xl glow-effect cyber-border backdrop-blur-md">
                    <div class="text-center space-y-1 mb-6">
                        <h2 class="text-2xl font-black tracking-wider uppercase text-transparent bg-clip-text bg-gradient-to-r from-blue-300 via-white to-indigo-400">
                            Master Admin Access
                        </h2>
                        <p class="text-xs text-gray-400 font-mono">Pengurusan Eksklusif Sistem Architech Labs</p>
                    </div>

                    <form @submit.prevent="login()" class="space-y-4">
                        <div>
                            <label class="block text-xs font-mono uppercase text-blue-400 mb-1">Admin Username</label>
                            <input type="text" x-model="loginForm.username" required class="w-full px-4 py-2.5 bg-gray-950 border border-gray-800 rounded-xl text-sm text-blue-100 focus:border-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-mono uppercase text-blue-400 mb-1">Password</label>
                            <input type="password" x-model="loginForm.password" required class="w-full px-4 py-2.5 bg-gray-950 border border-gray-800 rounded-xl text-sm text-blue-100 focus:border-blue-500 focus:outline-none">
                        </div>
                        <div class="text-red-400 text-xs font-mono" x-text="loginError"></div>
                        <button type="submit" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold font-mono text-xs rounded-xl shadow-lg glow-effect">LOGIN ADMIN PANEL</button>
                    </form>
                </div>
            </div>
        </template>

        <!-- FASA 3: Papan Pemuka Admin (Master Dashboard) -->
        <template x-if="isUnlocked && isLoggedIn">
            <div class="space-y-6">
                <div class="bg-gradient-to-r from-blue-900/50 via-indigo-900/40 to-gray-900 rounded-2xl p-6 text-white cyber-border glow-effect flex justify-between items-center">
                    <div>
                        <h1 class="text-2xl font-black text-white">Master Control Panel</h1>
                        <p class="text-indigo-300 text-xs font-mono mt-1">Urus akaun klien, tetapan pelayan Railway, dan hantar e-mel TQ automatik.</p>
                        <p class="text-xs text-blue-400 mt-2 font-mono">
                            <i class="fa-solid fa-clock-rotate-left mr-1"></i> Kemaskini Terkini: <span x-text="lastUpdatedTime"></span>
                        </p>
                    </div>
                    <div class="bg-gray-900/80 cyber-border px-4 py-2.5 rounded-xl text-right">
                        <span class="block text-[10px] font-mono text-gray-400 uppercase">Jumlah Klien Aktif</span>
                        <span class="font-bold text-lg font-mono text-blue-300" x-text="clients.length"></span>
                    </div>
                </div>

                <!-- KOTAK VERCEL & RAILWAY DEPLOY MONITOR -->
                <div class="bg-gray-900 p-6 rounded-2xl cyber-border space-y-4">
                    <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                        <div class="flex items-center space-x-2">
                            <i class="fa-solid fa-cloud-arrow-up text-blue-400"></i>
                            <h3 class="font-bold text-sm font-mono text-blue-300">Vercel & Railway Deploy Status Monitor</h3>
                        </div>
                        <button @click="checkDeployStatus()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white font-mono text-xs rounded-xl shadow transition">
                            <i class="fa-solid fa-rotate mr-1"></i> Semak Status Deploy
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 font-mono text-xs">
                        <div class="p-4 bg-gray-950 rounded-xl cyber-border flex flex-col justify-between">
                            <div class="flex justify-between items-center">
                                <span class="text-gray-400 text-[10px] uppercase">Portal Klien (Vercel Server)</span>
                                <a href="https://leea-portal.vercel.app" target="_blank" class="text-blue-400 hover:underline text-[10px]">Buka Portal <i class="fa-solid fa-arrow-up-right-from-square ml-0.5"></i></a>
                            </div>
                            <div class="mt-3 flex items-center space-x-2">
                                <span class="w-3 h-3 rounded-full" :class="vercelStatus.isOnline ? 'bg-emerald-500 animate-pulse' : 'bg-yellow-500'"></span>
                                <span class="font-bold text-sm" :class="vercelStatus.isOnline ? 'text-emerald-400' : 'text-yellow-400'" x-text="vercelStatus.statusText"></span>
                            </div>
                            <span class="text-[10px] text-gray-500 mt-2 block" x-text="'Masa Semak: ' + vercelStatus.lastChecked"></span>
                        </div>

                        <div class="p-4 bg-gray-950 rounded-xl cyber-border flex flex-col justify-between">
                            <div class="flex justify-between items-center">
                                <span class="text-gray-400 text-[10px] uppercase">Backend Bot (Railway Server)</span>
                                <span class="text-indigo-300 text-[10px]">Multi-Tenant API</span>
                            </div>
                            <div class="mt-3 flex items-center space-x-2">
                                <span class="w-3 h-3 rounded-full" :class="railwayStatus.isOnline ? 'bg-emerald-500 animate-pulse' : 'bg-red-500'"></span>
                                <span class="font-bold text-sm" :class="railwayStatus.isOnline ? 'text-emerald-400' : 'text-red-400'" x-text="railwayStatus.statusText"></span>
                            </div>
                            <span class="text-[10px] text-gray-500 mt-2 block" x-text="'Masa Semak: ' + railwayStatus.lastChecked"></span>
                        </div>
                    </div>
                </div>

                <!-- Bahagian Pengurusan Kod Akses Pegawai Baru (Tambah Kod Admin Khas) -->
                <div class="bg-gray-900 p-6 rounded-2xl cyber-border space-y-4">
                    <h3 class="font-bold text-sm font-mono text-blue-300">Pengurusan Kod Unlock Khas (Pegawai / Admin Baru)</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <template x-for="(adminItem, idx) in authorizedPins" :key="idx">
                            <div class="p-3 bg-gray-950 border border-gray-800 rounded-xl flex justify-between items-center font-mono text-xs">
                                <div>
                                    <span class="text-gray-400 block text-[10px]">NAMA / JAWATAN:</span>
                                    <span class="text-white font-bold" x-text="adminItem.name"></span>
                                    <span class="text-blue-400 block mt-1">PIN: ****</span>
                                </div>
                                <button @click="deleteAdminPin(idx)" class="text-red-400 hover:text-red-300 p-2" title="Padam Kod">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </template>
                    </div>

                    <form @submit.prevent="addNewAdminPin()" class="grid grid-cols-1 md:grid-cols-3 gap-3 pt-2">
                        <div>
                            <input type="text" x-model="newAdminName" placeholder="Nama Pegawai Baru" required class="w-full px-3 py-2 bg-gray-950 border border-gray-800 rounded-xl text-xs font-mono text-blue-100 focus:outline-none">
                        </div>
                        <div>
                            <input type="password" maxlength="4" x-model="newAdminPinCode" placeholder="Kod 4 Digit Baru" required class="w-full px-3 py-2 bg-gray-950 border border-gray-800 rounded-xl text-xs font-mono text-blue-100 focus:outline-none">
                        </div>
                        <div>
                            <button type="submit" class="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white font-mono text-xs font-bold rounded-xl shadow">Tambah Kod Akses</button>
                        </div>
                    </form>
                </div>

                <!-- Jadual Senarai Klien -->
                <div class="bg-gray-900 rounded-2xl cyber-border overflow-hidden shadow-xl">
                    <div class="p-6 border-b border-gray-800 flex justify-between items-center bg-gray-950">
                        <h3 class="font-bold text-sm font-mono text-blue-300">Senarai Akaun Klien & ID Neural</h3>
                        <button @click="openClientModal('add')" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-mono font-bold rounded-xl shadow transition glow-effect">
                            <i class="fa-solid fa-user-plus mr-1"></i> Tambah Klien Baru
                        </button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse font-mono text-xs">
                            <thead>
                                <tr class="bg-gray-950/80 text-gray-400 uppercase border-b border-gray-800">
                                    <th class="p-4">Client ID</th>
                                    <th class="p-4">Nama Syarikat</th>
                                    <th class="p-4">Username Login</th>
                                    <th class="p-4">Password</th>
                                    <th class="p-4">Telefon & E-mel</th>
                                    <th class="p-4">Railway Bot URL</th>
                                    <th class="p-4">Status</th>
                                    <th class="p-4 text-center">Tindakan</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-800/60">
                                <template x-for="(client, index) in clients" :key="index">
                                    <tr class="hover:bg-gray-800/30 transition">
                                        <td class="p-4 font-bold text-blue-400" x-text="client.clientId"></td>
                                        <td class="p-4 font-bold text-white" x-text="client.companyName || client.username"></td>
                                        <td class="p-4 font-bold text-indigo-300" x-text="client.username"></td>
                                        <td class="p-4"><code class="px-2 py-1 bg-gray-950 border border-gray-800 rounded text-gray-300" x-text="client.password || '-'"></code></td>
                                        <td class="p-4 text-[11px] text-gray-400">
                                            <div x-text="client.phone || '-'"></div>
                                            <div class="text-blue-400/70" x-text="client.email || '-'"></div>
                                        </td>
                                        <td class="p-4"><a :href="client.railwayUrl" target="_blank" class="text-blue-400 hover:underline truncate max-w-[180px] block" x-text="client.railwayUrl"></a></td>
                                        <td class="p-4"><span class="px-2.5 py-1 text-[10px] font-bold rounded-full bg-blue-500/20 text-blue-300 border border-blue-500/30" x-text="client.status"></span></td>
                                        <td class="p-4 text-center space-x-1">
                                            <button @click="openClientModal('edit', index)" class="px-2.5 py-1 bg-blue-600 hover:bg-blue-500 text-white rounded">Edit</button>
                                            <button @click="approveRenewal(index)" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded">Renew</button>
                                            <button @click="deleteClient(index)" class="px-2.5 py-1 bg-red-600 hover:bg-red-500 text-white rounded">Padam</button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </template>

        <!-- Modal Tambah/Edit Klien -->
        <div x-show="showClientModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4" style="display: none;">
            <div class="bg-gray-900 w-full max-w-md rounded-2xl shadow-2xl cyber-border overflow-hidden flex flex-col">
                <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-950">
                    <h3 class="font-bold text-sm font-mono text-blue-300" x-text="modalMode === 'edit' ? 'Kemaskini Maklumat Klien' : 'Tambah Klien Baru & Hantar E-mel TQ'"></h3>
                    <button @click="showClientModal = false" class="text-gray-400 hover:text-red-400 text-lg p-2"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form @submit.prevent="saveClient()" class="p-6 space-y-4 font-mono text-xs">
                    <div>
                        <label class="block uppercase text-blue-400 mb-1">Nama Syarikat</label>
                        <input type="text" x-model="clientForm.companyName" placeholder="Contoh: Shahril Basri Leisure Enterprise" required class="w-full px-4 py-2 bg-gray-950 border border-gray-800 rounded-xl text-blue-100 focus:border-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block uppercase text-blue-400 mb-1">Username Login Klien</label>
                        <input type="text" x-model="clientForm.username" placeholder="Contoh: sbltransport" required class="w-full px-4 py-2 bg-gray-950 border border-gray-800 rounded-xl text-blue-100 focus:border-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block uppercase text-blue-400 mb-1">Kata Laluan Klien</label>
                        <input type="text" x-model="clientForm.password" required class="w-full px-4 py-2 bg-gray-950 border border-gray-800 rounded-xl text-blue-100 focus:border-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block uppercase text-blue-400 mb-1">Nombor Telefon WhatsApp Klien</label>
                        <input type="text" x-model="clientForm.phone" placeholder="+60123456789" required class="w-full px-4 py-2 bg-gray-950 border border-gray-800 rounded-xl text-blue-100 focus:border-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block uppercase text-blue-400 mb-1">E-mel Klien</label>
                        <input type="email" x-model="clientForm.email" placeholder="klien@example.com" required class="w-full px-4 py-2 bg-gray-950 border border-gray-800 rounded-xl text-blue-100 focus:border-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block uppercase text-blue-400 mb-1">Domain Railway Bot URL</label>
                        <input type="text" x-model="clientForm.railwayUrl" placeholder="https://..." class="w-full px-4 py-2 bg-gray-950 border border-gray-800 rounded-xl text-blue-100 focus:border-blue-500 focus:outline-none" required>
                    </div>
                    <div class="flex justify-end space-x-2 pt-4 border-t border-gray-800">
                        <button type="button" @click="showClientModal = false" class="px-4 py-2 bg-gray-800 text-gray-300 rounded-xl">Batal</button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow glow-effect">Simpan & Aktifkan Bot</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="mt-auto py-6 border-t border-gray-900 text-center text-xs font-mono text-gray-500">
        &copy; 2026 LEEA AI SYSTEM. Master Admin Node. All Rights Reserved.
    </footer>

    <script>
        function adminData() {
            return {
                isUnlocked: false,
                enteredPin: '',
                pinError: '',
                isLoggedIn: false,
                currentAdminRole: 'Superadmin',
                loginForm: { username: '', password: '' },
                loginError: '',
                clients: [],
                authorizedPins: [],
                newAdminName: '',
                newAdminPinCode: '',
                showClientModal: false,
                modalMode: 'add',
                editIndex: null,
                clientForm: { companyName: '', username: '', password: '', phone: '', email: '', railwayUrl: '' },
                lastUpdatedTime: '',
                
                // Status Deploy Vercel Portal
                vercelStatus: {
                    isOnline: false,
                    statusText: 'Menyemak...',
                    lastChecked: '-'
                },

                // Status Server Railway
                railwayStatus: {
                    isOnline: false,
                    statusText: 'Menyemak...',
                    lastChecked: '-'
                },

                init() {
                    this.fetchClients();
                    this.fetchAdminPins();
                    this.updateTimestamp();
                    this.checkDeployStatus();

                    if (localStorage.getItem('leea_admin_unlocked') === 'true') {
                        this.isUnlocked = true;
                        this.currentAdminRole = localStorage.getItem('leea_admin_role_name') || 'Superadmin';
                    }
                    if (localStorage.getItem('leea_admin_logged') === 'true') {
                        this.isLoggedIn = true;
                    }
                },

                async checkDeployStatus() {
                    this.vercelStatus.statusText = 'Menyemak Vercel...';
                    this.railwayStatus.statusText = 'Menyemak Railway...';

                    // 1. Semak Vercel Portal (https://leea-portal.vercel.app)
                    try {
                        const vercelRes = await fetch('https://leea-portal.vercel.app', { method: 'GET', mode: 'no-cors' });
                        this.vercelStatus.isOnline = true;
                        this.vercelStatus.statusText = 'DEPLOYED & READY 🟢';
                    } catch (err) {
                        this.vercelStatus.isOnline = false;
                        this.vercelStatus.statusText = 'SEDANG DEPLOY / OFFLINE 🟡';
                    }

                    // 2. Semak Railway Backend (https://leeasystem-production.up.railway.app)
                    const targetUrl = (this.clients.length > 0 && this.clients[0].railwayUrl) ? this.clients[0].railwayUrl : 'https://leeasystem-production.up.railway.app';
                    try {
                        const railwayRes = await fetch(targetUrl, { method: 'GET', mode: 'cors' });
                        if (railwayRes.ok) {
                            this.railwayStatus.isOnline = true;
                            this.railwayStatus.statusText = 'ONLINE & ACTIVE 🟢';
                        } else {
                            this.railwayStatus.isOnline = true;
                            this.railwayStatus.statusText = 'ONLINE (OK)';
                        }
                    } catch (err) {
                        this.railwayStatus.isOnline = false;
                        this.railwayStatus.statusText = 'OFFLINE / REDEPLOYING... 🟡';
                    }

                    const now = new Date();
                    const timeString = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
                    this.vercelStatus.lastChecked = timeString;
                    this.railwayStatus.lastChecked = timeString;
                },

                fetchAdminPins() {
                    const saved = localStorage.getItem('leea_authorized_pins');
                    if (saved) {
                        this.authorizedPins = JSON.parse(saved);
                    } else {
                        this.authorizedPins = [
                            { name: 'Superadmin Utama', pin: '7357' }
                        ];
                        localStorage.setItem('leea_authorized_pins', JSON.stringify(this.authorizedPins));
                    }
                },

                verifyPinCode() {
                    this.pinError = '';
                    const matched = this.authorizedPins.find(item => item.pin === this.enteredPin.trim());
                    if (matched) {
                        this.isUnlocked = true;
                        this.currentAdminRole = matched.name;
                        localStorage.setItem('leea_admin_unlocked', 'true');
                        localStorage.setItem('leea_admin_role_name', matched.name);
                        this.enteredPin = '';
                    } else {
                        this.pinError = 'Unlock Code Salah! Sila cuba lagi.';
                    }
                },

                addNewAdminPin() {
                    if (this.newAdminPinCode.length !== 4) {
                        alert('Kod PIN mesti tepat 4 digit!');
                        return;
                    }
                    this.authorizedPins.push({
                        name: this.newAdminName,
                        pin: this.newAdminPinCode.trim()
                    });
                    localStorage.setItem('leea_authorized_pins', JSON.stringify(this.authorizedPins));
                    this.newAdminName = '';
                    this.newAdminPinCode = '';
                    alert('Kod PIN admin baharu berjaya didaftarkan!');
                },

                deleteAdminPin(index) {
                    if (this.authorizedPins.length <= 1) {
                        alert('Anda mesti kekalkan sekurang-kurangnya satu kod akses!');
                        return;
                    }
                    if (confirm('Padam akses kod ini?')) {
                        this.authorizedPins.splice(index, 1);
                        localStorage.setItem('leea_authorized_pins', JSON.stringify(this.authorizedPins));
                    }
                },

                updateTimestamp() {
                    const now = new Date();
                    this.lastUpdatedTime = now.toLocaleString('en-GB', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
                },

                fetchClients() {
                    const saved = localStorage.getItem('leea_admin_clients');
                    if (saved) {
                        this.clients = JSON.parse(saved);
                    } else {
                        this.clients = [
                            { clientId: 'CLI-1001', companyName: 'Shahril Basri Leisure Enterprise', username: 'sbltransport', password: 'securepass456', phone: '+60132434200', email: 'architechlabs.io@gmail.com', railwayUrl: 'https://web-production-07b92.up.railway.app', status: 'Paid 🟢', expiryDate: '27/09/2026' },
                            { clientId: 'CLI-1002', companyName: 'Architech Laboratory', username: 'architech', password: 'H@$$ayang8683', phone: '+601123687357', email: 'radzmil@gmail.com', railwayUrl: 'https://leeasystem-production.up.railway.app', status: 'Paid 🟢', expiryDate: '27/09/2026' }
                        ];
                        localStorage.setItem('leea_admin_clients', JSON.stringify(this.clients));
                    }
                },

                saveClients() {
                    localStorage.setItem('leea_admin_clients', JSON.stringify(this.clients));
                    this.updateTimestamp();
                },

                login() {
                    this.loginError = '';
                    if (this.loginForm.username === 'admin' && this.loginForm.password === 'adminpassword123') {
                        this.isLoggedIn = true;
                        localStorage.setItem('leea_admin_logged', 'true');
                        this.updateTimestamp();
                        this.checkDeployStatus();
                    } else {
                        this.loginError = 'ID Admin atau Katalaluan Salah!';
                    }
                },

                logout() {
                    this.isLoggedIn = false;
                    this.isUnlocked = false;
                    localStorage.removeItem('leea_admin_logged');
                    localStorage.removeItem('leea_admin_unlocked');
                    localStorage.removeItem('leea_admin_role_name');
                },

                openClientModal(mode, index = null) {
                    this.modalMode = mode;
                    if (mode === 'edit' && index !== null) {
                        this.editIndex = index;
                        const c = this.clients[index];
                        this.clientForm = { 
                            companyName: c.companyName || c.username, 
                            username: c.username, 
                            password: c.password, 
                            phone: c.phone, 
                            email: c.email, 
                            railwayUrl: c.railwayUrl 
                        };
                    } else {
                        this.editIndex = null;
                        this.clientForm = { companyName: '', username: '', password: '', phone: '', email: '', railwayUrl: '' };
                    }
                    this.showClientModal = true;
                },

                async saveClient() {
                    let assignedId = '';
                    let cleanUsername = this.clientForm.username.toLowerCase().replace(/[^a-z0-9]/g, '');

                    if (this.modalMode === 'edit' && this.editIndex !== null) {
                        this.clients[this.editIndex].companyName = this.clientForm.companyName;
                        this.clients[this.editIndex].username = this.clientForm.username;
                        this.clients[this.editIndex].password = this.clientForm.password;
                        this.clients[this.editIndex].phone = this.clientForm.phone;
                        this.clients[this.editIndex].email = this.clientForm.email;
                        this.clients[this.editIndex].railwayUrl = this.clientForm.railwayUrl;
                        assignedId = this.clients[this.editIndex].clientId;
                        alert('Maklumat klien berjaya dikemaskini!');
                    } else {
                        const nextId = 1000 + this.clients.length + 1;
                        assignedId = `CLI-${nextId}`;
                        this.clients.push({
                            clientId: assignedId,
                            companyName: this.clientForm.companyName,
                            username: this.clientForm.username,
                            password: this.clientForm.password,
                            phone: this.clientForm.phone,
                            email: this.clientForm.email,
                            railwayUrl: this.clientForm.railwayUrl,
                            status: 'Paid 🟢',
                            expiryDate: '27/09/2026'
                        });

                        const allClientsMap = JSON.parse(localStorage.getItem('leea_all_clients_map') || '{}');
                        allClientsMap[assignedId] = {
                            clientId: assignedId,
                            username: this.clientForm.username,
                            companyName: this.clientForm.companyName,
                            railwayUrl: this.clientForm.railwayUrl
                        };
                        localStorage.setItem('leea_all_clients_map', JSON.stringify(allClientsMap));

                        const dbAutoCreateUrl = "https://script.google.com/macros/s/AKfycbzbYqD6x2KjHx4M5WB8-YLrGCdeymX08hHibOK5B3S0Qkq5Euk35extB8DERlSeMW0Ylg/exec";
                        try {
                            await fetch(dbAutoCreateUrl, {
                                method: 'POST',
                                mode: 'no-cors',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    action: "create_client_db",
                                    client_key: cleanUsername,
                                    client_name: this.clientForm.companyName,
                                    client_id: assignedId
                                })
                            });
                        } catch (err) {
                            console.error("Gagal mencetuskan automasi penciptaan Fail Google Sheet:", err);
                        }

                        try {
                            await fetch(`${this.clientForm.railwayUrl}/api/notify-activation`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    phone: this.clientForm.phone,
                                    username: this.clientForm.username,
                                    company: this.clientForm.companyName,
                                    email: this.clientForm.email
                                })
                            });
                        } catch (err) {
                            console.error("Gagal hantar WhatsApp automatik ke nombor klien:", err);
                        }

                        const emailScriptUrl = "https://script.google.com/macros/s/AKfycbzCUuqaQNN8z91lSVgMnTAMbhujbMeMcLJSxj8k--MOufN-ROGo6eEVBOVstXmhmlkWeA/exec";
                        if (emailScriptUrl) {
                            try {
                                await fetch(emailScriptUrl, {
                                    method: 'POST',
                                    mode: 'no-cors',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        email: this.clientForm.email,
                                        username: this.clientForm.username,
                                        companyName: this.clientForm.companyName,
                                        clientId: assignedId,
                                        password: this.clientForm.password
                                    })
                                });
                            } catch (err) {
                                console.error("Gagal menghantar e-mel automatik:", err);
                            }
                        }

                        alert('Klien baru berjaya didaftarkan, fail DB Sheet berasingan dijana, WhatsApp notifikasi & e-mel TQ dihantar!');
                    }
                    this.saveClients();
                    this.showClientModal = false;
                },

                approveRenewal(index) {
                    this.clients[index].status = 'Paid 🟢';
                    this.saveClients();
                    alert('Status langganan klien diperbaharui!');
                },

                deleteClient(index) {
                    if (confirm('Adakah anda pasti mahu memadam akaun klien ini?')) {
                        this.clients.splice(index, 1);
                        this.saveClients();
                    }
                }
            }
        }
    </script>
</body>
</html>
